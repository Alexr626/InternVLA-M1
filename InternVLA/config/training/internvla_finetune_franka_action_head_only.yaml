run_id: internvla_franka_action_head_only
run_root_dir: ./playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: null  # Uses default from wandb login
wandb_project: internvla_franka
is_debug: false

framework:
  framework_py: InternVLA-M1
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen2.5-VL-3B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14
  layer_qformer:
    qformer_end_layer: 37
    qformer_start_layer: 36
    num_query_tokens: 64
    input_dim: 2048
    ouptput_dim: 768
    grad_scale: 0.5

  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 768
    action_dim: 8  # 7 joints + 1 gripper for Franka
    use_ema: false
    future_action_window_size: 15
    past_action_window_size: 0
    repeated_diffusion_steps: 8

  fm_head_config:
    input_embedding_dim: 1536
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 8  # 7 joints + 1 gripper for Franka
    future_action_window_size: 15
    action_horizon: 16
    past_action_window_size: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      attention_head_dim: 48
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_attention_heads: 32
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # InternVLA datasets directory (separate from openpi lerobot cache)
    data_root_dir: ./playground/Datasets
    data_mix: franka_pick_and_place_12_13_internvla
    action_type: joints
    # Disable pause frame deletion for joint-space datasets (requires Cartesian coordinates)
    delete_pause_frame: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs: ["image", "wrist_image"]
    image_size: [224, 224]

trainer:
  epochs: 100
  max_train_steps: 4000
  num_warmup_steps: 400
  save_interval: 2000
  eval_interval: 100
  learning_rate:
    base: 1e-04  # Higher LR for action head only
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  # Freeze everything except action_model
  freeze_modules: 'qwen_vl_interface,dino_encoder,dino_pro,layer_qformer'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
